[package]
name = "privacy-aperture"
version = "0.1.0"
description = "Local-first laptop privacy dimmer"
authors = ["Privacy Aperture contributors"]
edition = "2021"

[lib]
name = "privacy_aperture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
